apply plugin: 'com.android.application'

// Release passwords stay out of git. Copy android-app/keystore.properties.example
// to android-app/keystore.properties, or set the KAYAN_* environment variables.
// Debug builds use the Android debug keystore and do not need either.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('../keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

def kayanProp = { String name, String envName ->
    def fromEnv = System.getenv(envName)
    if (fromEnv != null && fromEnv.trim()) return fromEnv.trim()
    def fromFile = keystoreProperties.getProperty(name)
    if (fromFile != null && fromFile.trim()) return fromFile.trim()
    return ''
}

def kayanStoreFile = kayanProp('storeFile', 'KAYAN_STORE_FILE')
if (!kayanStoreFile) kayanStoreFile = 'keystore/kayan-release.jks'
def kayanStorePassword = kayanProp('storePassword', 'KAYAN_STORE_PASSWORD')
def kayanKeyAlias = kayanProp('keyAlias', 'KAYAN_KEY_ALIAS')
if (!kayanKeyAlias) kayanKeyAlias = 'kayan'
def kayanKeyPassword = kayanProp('keyPassword', 'KAYAN_KEY_PASSWORD')
def kayanStoreBase = keystorePropertiesFile.parentFile
def kayanStore = new File(kayanStoreFile)
if (!kayanStore.isAbsolute()) kayanStore = new File(kayanStoreBase, kayanStoreFile)
def hasReleaseSigning = kayanStore.isFile() && kayanStorePassword && kayanKeyPassword

android {
    namespace "com.amrkz.kayaniptv"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.amrkz.kayaniptv"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.0.3"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    if (hasReleaseSigning) {
        signingConfigs {
            release {
                storeFile kayanStore
                storePassword kayanStorePassword
                keyAlias kayanKeyAlias
                keyPassword kayanKeyPassword
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

def signingHint = 'Release signing needs android-app/keystore.properties (see keystore.properties.example) or KAYAN_STORE_FILE, KAYAN_STORE_PASSWORD, KAYAN_KEY_ALIAS and KAYAN_KEY_PASSWORD. The keystore file is not in git. Debug builds do not need it.'
gradle.taskGraph.whenReady { graph ->
    def wantsRelease = graph.allTasks.any { t ->
        t.name == 'assembleRelease' || t.name == 'bundleRelease' || t.name == 'packageRelease' || t.name == 'signReleaseBundle'
    }
    if (wantsRelease && !hasReleaseSigning) {
        throw new GradleException(signingHint)
    }
}

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
